name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Controlla i 4 secret e prepara la chiave. Se qualcosa non va, la build si ferma con un
      # messaggio chiaro: un APK firmato con un'altra chiave non si installerebbe come aggiornamento.
      - name: Verifica secret e keystore di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_KEY_PW: ${{ secrets.KEY_PASSWORD }}
          RAW_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$RAW_STORE_PW" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$RAW_KEY_PW" ] && missing="$missing KEY_PASSWORD"
          [ -z "$RAW_ALIAS" ] && missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Secret mancanti:$missing. Aggiungili in Settings > Secrets and variables > Actions > Repository secrets (nomi tutti in MAIUSCOLO)."
            exit 1
          fi

          # Rimuove spazi e a capo copiati per sbaglio
          store_pw=$(printf '%s' "$RAW_STORE_PW" | tr -d '[:space:]')
          key_pw=$(printf '%s' "$RAW_KEY_PW" | tr -d '[:space:]')
          alias=$(printf '%s' "$RAW_ALIAS" | tr -d '[:space:]')
          echo "::add-mask::$store_pw"
          echo "::add-mask::$key_pw"

          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 non valido: ricopialo per intero (è una sola riga lunghissima)."
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_pw" -alias "$alias" > /dev/null 2>&1; then
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_pw" > /dev/null 2>&1; then
              echo "::error::KEYSTORE_PASSWORD sbagliata, oppure KEYSTORE_BASE64 incompleto."
            else
              echo "::error::KEY_ALIAS sbagliato: deve essere esattamente 'compleanni' (il nome originale, anche se l'app ora si chiama Birthdawn)."
            fi
            exit 1
          fi

          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$store_pw"
            echo "KEY_PASSWORD=$key_pw"
            echo "KEY_ALIAS=$alias"
          } >> "$GITHUB_ENV"
          echo "✅ Secret corretti: l'APK verrà firmato con la tua chiave."
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_pw" -alias "$alias" | grep "SHA256:"

      # Il codice ora sta in dev/luca/birthdawn: se nel repository è rimasta la vecchia
      # cartella dev/luca/compleanni (es. dopo un "Upload files" da GitHub), la ignora.
      - name: Rimuovi codice vecchio rimasto nel repository
        run: |
          OLD=app/src/main/java/dev/luca/compleanni
          if [ -d "$OLD" ]; then
            echo "::warning::Trovata la vecchia cartella $OLD: ignorata per questa build. Eliminala dal repository."
            rm -rf "$OLD"
          fi

      - name: Compila APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk Birthdawn.apk

      - name: Controlla la firma dell'APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Birthdawn.apk | grep "SHA-256"
          echo "L'impronta qui sopra deve essere uguale a quella del passo 'Verifica secret'."

      - uses: actions/upload-artifact@v4
        with:
          name: Birthdawn-apk
          path: Birthdawn.apk

      - name: Pubblica release (solo per tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Birthdawn.apk
